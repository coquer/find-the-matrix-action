name: Test
on:
  push:
    branches:
      - solido

  pull_request:
    branches:
      - solido

jobs:
  test-github-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Package
        run: npm run package

      - name: Verify it works (filter by type)
        id: verify-key
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          haystack: './matrix.json'
          needle: '["go"]'
          key: 'type'
          tag: 'v1'

      - name: Verify it works (filter by service)
        id: verify-default
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          haystack: './matrix.json'
          needle: '["organization"]'
          tag: 'v1'

      - name: Print outputs
        run: |
          echo "verify-key filtered: ${{ steps.verify-key.outputs.filtered }}"
          echo "verify-default filtered: ${{ steps.verify-default.outputs.filtered }}"
